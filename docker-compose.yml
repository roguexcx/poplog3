services:
  mysql:
    image: mysql:8.4
    container_name: poplog-v3-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: poplog_v3
      MYSQL_USER: poplog
      MYSQL_PASSWORD: poplog_local_password
      MYSQL_ROOT_PASSWORD: poplog_root_password
    ports:
      - "3306:3306"
    volumes:
      - poplog_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "poplog", "-ppoplog_local_password"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  poplog_mysql_data:
