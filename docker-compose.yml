services:
  mysql:
    image: mysql:8.4
    container_name: poplog-v3-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: poplog_v3
      MYSQL_USER: poplog
      MYSQL_PASSWORD: poplog_local_password
      MYSQL_ROOT_PASSWORD: poplog_root_password
    ports:
      - "3306:3306"
    volumes:
      - poplog_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "poplog", "-ppoplog_local_password"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: poplog-v3-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "6379:6379"
    volumes:
      - poplog_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio:latest
    container_name: poplog-v3-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: poplog_minio
      MINIO_ROOT_PASSWORD: poplog_minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - poplog_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    container_name: poplog-v3-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set poplog http://minio:9000 poplog_minio poplog_minio_secret
        mc mb --ignore-existing poplog/poplog-assets
        mc anonymous set download poplog/poplog-assets

volumes:
  poplog_mysql_data:
  poplog_redis_data:
  poplog_minio_data:
