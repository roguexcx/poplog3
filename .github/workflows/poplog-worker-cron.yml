name: POPLOG Worker Cron

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  refresh-workers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      POPLOG_CRON_URL: ${{ secrets.POPLOG_CRON_URL }}
      POPLOG_CRON_SECRET: ${{ secrets.POPLOG_CRON_SECRET }}
    steps:
      - name: Tick refresh worker cron
        shell: bash
        run: |
          if [ -z "$POPLOG_CRON_URL" ] || [ -z "$POPLOG_CRON_SECRET" ]; then
            echo "POPLOG_CRON_URL or POPLOG_CRON_SECRET not configured; skipping."
            exit 0
          fi

          url="${POPLOG_CRON_URL%/}"
          if [[ "$url" != */api/cron/refresh-workers ]]; then
            url="$url/api/cron/refresh-workers"
          fi

          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $POPLOG_CRON_SECRET" \
            --header "Content-Type: application/json" \
            "$url"
